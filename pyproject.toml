[project]
name = "bachelorarbeit-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastexcel>=0.21.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
